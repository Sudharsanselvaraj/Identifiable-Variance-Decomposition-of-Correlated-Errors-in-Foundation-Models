[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lineage-era"
version = "0.2.0"
description = "Identifiability/precision-gated analysis of lineage vs release-era structure in LLM errors"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.1.3",
    "scipy==1.17.1",
    "pandas==3.0.5",
    "statsmodels==0.14.6",
    "matplotlib==3.9.2",
    "tabulate==0.9.0",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]
# Leaderboard data (Exp04): Hub metadata + projected parquet reads.
# Pinned to the versions of the 9 October 2026 download.
ollb = ["huggingface_hub==0.36.2", "pyarrow==25.0.0"]
# GPU evaluation of the original 16-model arm (not needed for analysis).
eval = ["lm_eval", "torch", "transformers", "accelerate", "bitsandbytes"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["src/lineage_era"]
markers = ["slow: Monte Carlo / optimizer searches (several seconds each); deselect with -m \"not slow\""]
