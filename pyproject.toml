[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lineage-era"
version = "0.2.0"
description = "Identifiability/precision-gated analysis of lineage vs release-era structure in LLM errors"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.1.3",
    "scipy==1.17.1",
    "pandas==3.0.5",
    "statsmodels==0.14.6",
    "matplotlib==3.9.2",
    "tabulate",
]

[project.optional-dependencies]
test = ["pytest"]
# Leaderboard data (Exp04): Hub metadata + projected parquet reads.
ollb = ["huggingface_hub>=0.36", "pyarrow>=15"]
# GPU evaluation of the original 16-model arm (not needed for analysis).
eval = ["lm_eval", "torch", "transformers", "accelerate", "bitsandbytes"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["src/lineage_era"]
